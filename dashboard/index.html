<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VPS Panel - Linux Server Management Dashboard">
    <title>VPS Panel — Login</title>
    <link rel="stylesheet" href="/css/morphe.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
<div class="login-page">
    <div class="login-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-lines"></div>
    </div>

    <div class="login-card" id="loginCard">
        <div class="login-logo">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <h1 class="text-gradient">VPS Panel</h1>
            <p>Server Management Dashboard</p>
        </div>

        <div class="login-error" id="loginError">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            <span id="errorText"></span>
        </div>

        <form class="login-form" id="loginForm" autocomplete="on">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-icon">
                    <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                    <input type="text" id="username" name="username" class="input" placeholder="Enter username" autocomplete="username" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                    <input type="password" id="password" name="password" class="input" placeholder="Enter password" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <svg id="loginSpinner" class="hidden animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </button>
        </form>

        <div class="login-footer">
            <p>VPS Panel v1.0.0 • Secure Server Management</p>
        </div>
    </div>
</div>

<script>
const API_BASE = '';
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    const spinner = document.getElementById('loginSpinner');
    const errorDiv = document.getElementById('loginError');
    const errorText = document.getElementById('errorText');
    const card = document.getElementById('loginCard');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showError('Please enter both username and password'); return; }
    btn.disabled = true; btnText.textContent = 'Signing in...'; spinner.classList.remove('hidden'); errorDiv.classList.remove('visible');
    try {
        const res = await fetch(API_BASE + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (res.ok) { localStorage.setItem('vpspanel_token', data.access_token); localStorage.setItem('vpspanel_refresh', data.refresh_token); window.location.href = '/dashboard'; }
        else { showError(data.detail || 'Invalid credentials'); card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 500); }
    } catch (err) { showError('Connection failed. Is the server running?'); }
    finally { btn.disabled = false; btnText.textContent = 'Sign In'; spinner.classList.add('hidden'); }
    function showError(msg) { errorText.textContent = msg; errorDiv.classList.add('visible'); }
});
const token = localStorage.getItem('vpspanel_token');
if (token) { fetch(API_BASE + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } }).then(res => { if (res.ok) window.location.href = '/dashboard'; }).catch(() => {}); }
</script>
</body>
</html>
