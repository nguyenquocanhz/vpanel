<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS Panel — File Manager</title>
    <link rel="stylesheet" href="/css/morphe.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/filemanager.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <header class="top-header">
            <div class="header-left">
                <h2 class="flex items-center gap-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
                    File Manager
                </h2>
            </div>
            <div class="header-right">
                <button class="btn btn-ghost btn-sm" onclick="toggleUpload()">Upload</button>
                <button class="btn btn-ghost btn-sm" onclick="promptNewFolder()">New Folder</button>
                <button class="btn btn-primary btn-sm" onclick="navigate(currentPath)">Refresh</button>
            </div>
        </header>
        <div class="page-content">
            <div class="glass p-3 animate-in">
                <div class="fm-toolbar">
                    <button class="btn btn-ghost btn-sm" onclick="goUp()" title="Go up">← Back</button>
                    <div class="breadcrumb" id="breadcrumb"></div>
                </div>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                    <p class="text-sm text-muted">Drop files here or click to upload</p>
                    <input type="file" id="fileInput" multiple hidden onchange="uploadFiles(this.files)">
                </div>
                <div class="file-grid" id="fileGrid"></div>
            </div>
        </div>
    </main>
</div>

<!-- Editor -->
<div class="editor-overlay" id="editorOverlay">
    <div class="editor-panel">
        <div class="editor-header">
            <h3 id="editorTitle">Edit</h3>
            <div class="editor-path" id="editorPath"></div>
            <div class="flex gap-sm">
                <button class="btn btn-primary btn-sm" onclick="saveFile()">Save (Ctrl+S)</button>
                <button class="btn btn-ghost btn-sm" onclick="closeEditor()">Close</button>
            </div>
        </div>
        <div class="editor-body"><textarea id="editorContent" spellcheck="false"></textarea></div>
        <div class="editor-footer">
            <span id="lineInfo">Ln 1, Col 1</span>
            <span id="totalLines">0 lines</span>
        </div>
    </div>
</div>

<!-- Context Menu -->
<div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item" onclick="ctxOpen()">
        <svg class="ctx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        Open
    </div>
    <div class="ctx-item" onclick="ctxEdit()">
        <svg class="ctx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
        Edit
    </div>
    <div class="ctx-item" onclick="ctxDownload()">
        <svg class="ctx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Download
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="ctxRename()">
        <svg class="ctx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 6H3"/><path d="M7 12H3"/><path d="M7 18H3"/><path d="M12.5 18a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M18.3 13.3l-3.6 3.6"/><path d="M16 6l5 5-7.7 7.7a1 1 0 0 1-.7.3H11v-2.6a1 1 0 0 1 .3-.7L16 11"/></svg>
        Rename
    </div>
    <div class="ctx-item" onclick="ctxChmod()">
        <svg class="ctx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Modify Access
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" onclick="ctxDelete()">
        <svg class="ctx-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        Delete
        <span class="ctx-key">Del</span>
    </div>
</div>

<!-- Chmod Modal -->
<div class="modal-overlay" id="chmodModal">
    <div class="modal chmod-modal">
        <div class="modal-title">Modify Access</div>
        <p class="text-sm text-muted" id="chmodPath">filename</p>
        <div class="chmod-grid">
            <div class="chmod-col">
                <h4>Owner</h4>
                <label><input type="checkbox" id="or" onchange="updateChmodPreview()"> Read</label>
                <label><input type="checkbox" id="ow" onchange="updateChmodPreview()"> Write</label>
                <label><input type="checkbox" id="ox" onchange="updateChmodPreview()"> Execute</label>
            </div>
            <div class="chmod-col">
                <h4>Group</h4>
                <label><input type="checkbox" id="gr" onchange="updateChmodPreview()"> Read</label>
                <label><input type="checkbox" id="gw" onchange="updateChmodPreview()"> Write</label>
                <label><input type="checkbox" id="gx" onchange="updateChmodPreview()"> Execute</label>
            </div>
            <div class="chmod-col">
                <h4>Others</h4>
                <label><input type="checkbox" id="wr" onchange="updateChmodPreview()"> Read</label>
                <label><input type="checkbox" id="ww" onchange="updateChmodPreview()"> Write</label>
                <label><input type="checkbox" id="wx" onchange="updateChmodPreview()"> Execute</label>
            </div>
        </div>
        <div class="chmod-preview" id="chmodPreview">755</div>
        <div class="input-group" style="margin-top:12px">
            <label>Or type octal mode</label>
            <input class="input" id="chmodInput" value="755" placeholder="755" maxlength="4" style="text-align:center;font-family:monospace;font-size:1.1rem">
        </div>
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="document.getElementById('chmodModal').classList.remove('active')">Cancel</button>
            <button class="btn btn-primary" onclick="applyChmod()">Apply</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/filemanager.js"></script>
</body>
</html>
